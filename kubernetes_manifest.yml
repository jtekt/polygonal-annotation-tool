apiVersion: apps/v1
kind: Deployment
metadata:
    name: polygonal-annotation-tool-legacy
spec:
    replicas: 1
    selector:
        matchLabels:
            app: polygonal-annotation-tool-legacy
    template:
        metadata:
            labels:
                app: polygonal-annotation-tool-legacy
        spec:
            containers:
                - name: polygonal-annotation-tool-legacy
                  image: ${CONTAINER_IMAGE_TAGGED}
                  env:
                      - name: VUE_APP_STORAGE_SERVICE_API_URL
                        value: http://172.16.98.153:30011/api
                      - name: VUE_APP_ANNOTATION_FIELD
                        value: polygonalAnnotation
                      - name: VUE_APP_LABELS
                        value: example
                      - name: VUE_APP_DEFAULT_LABEL
                        value: example
                  ports:
                      - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
    name: polygonal-annotation-tool-legacy
spec:
    ports:
        - port: 80
          nodePort: 30444
    selector:
        app: polygonal-annotation-tool-legacy
    type: NodePort
